[workspace]
resolver = "3"
# 通配符匹配不到目录时 cargo 会报错，所以目录出现一个加一个。
members = ["crates/*", "contracts/*", "services/*", "tests/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kernel-api = { path = "crates/kernel-api" }
kernel = { path = "crates/kernel" }
testkit = { path = "crates/testkit" }

browser-contract = { path = "contracts/browser" }
cli-contract = { path = "contracts/cli" }
clock-contract = { path = "contracts/clock" }
exec-contract = { path = "contracts/exec" }
files-contract = { path = "contracts/files" }
log-contract = { path = "contracts/log" }
sql-contract = { path = "contracts/sql" }
timer-contract = { path = "contracts/timer" }
tui-contract = { path = "contracts/tui" }
process-contract = { path = "contracts/process" }
prompt-contract = { path = "contracts/prompt" }
screenshot-contract = { path = "contracts/screenshot" }
vcs-contract = { path = "contracts/vcs" }
window-contract = { path = "contracts/window" }


async-trait = "0.1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
unicode-width = "0.2"
inventory = "0.3"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
sha2 = "0.10"
tempfile = "3"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.dev.package."*"]
opt-level = 2
